# Cấu hình núm xoay (Encoder)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Cấu hình màn hình (Display)
CONFIG_ZMK_DISPLAY=y

# --- Cấu hình Bluetooth tối ưu ---
# Tăng công suất phát sóng lên mức cao nhất (+8 dBm) để kết nối ổn định hơn
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Cho phép phím tự ngắt kết nối khi không dùng để tiết kiệm pin (Deep Sleep)
CONFIG_ZMK_SLEEP=y
# Thời gian chờ trước khi ngủ (ví dụ 1.800.000 ms = 30 phút)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Tắt ZMK Studio để tránh lỗi biên dịch (Đã để dấu #)
# CONFIG_ZMK_STUDIO=y
